<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>standby.flights live</title>
<meta name="description" content="Live flights over the real US: satellite map, 3D follow camera and the sky over your spot, in 16-bit style.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
/* standby.flights LIVE: a live flight tracker over the real US. Map, 3D follow camera, sky view and an
   altitude cross-section, drawn into a low-res buffer in 15-bit color and scaled up without smoothing. */
:root {
  --ink: #0b0d18; --panel: rgba(12, 14, 28, 0.86); --line: rgba(255, 255, 255, 0.16);
  --fg: #f2ecdc; --dim: #9aa0b8; --accent: #ffb000; --hot: #ff5c3a;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); }
body { font-family: Silkscreen, ui-monospace, monospace; color: var(--fg); user-select: none; -webkit-user-select: none; touch-action: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

/* top buttons */
#top { position: fixed; top: max(8px, env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; z-index: 5; pointer-events: none; }
#top button { pointer-events: auto; }
#credit { position: fixed; left: 8px; top: 160px; z-index: 4; font-size: 8px; line-height: 1.4; color: rgba(255, 255, 255, 0.62); text-shadow: 0 1px 0 #000; pointer-events: none; max-width: min(46%, 220px); }
#credit a { color: inherit; pointer-events: auto; }
button { font: 12px/1 Silkscreen, monospace; color: var(--fg); background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 8px 6px; min-height: 44px; min-width: 44px; cursor: pointer; }
button:active, button.on { background: var(--accent); color: #000; border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* zoom buttons */
#zoom { position: fixed; right: max(8px, env(safe-area-inset-right, 0px)); bottom: calc(max(8px, env(safe-area-inset-bottom, 0px)) + var(--cardh, 0px)); z-index: 5; display: grid; gap: 6px; }
#zoom button { font-size: 20px; width: 48px; }

/* flight card */
#card { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(8px, env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 16px)); z-index: 6;
  background: rgba(12, 14, 28, 0.9); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.ch { display: flex; align-items: center; gap: 8px; }
#cCall { font-weight: 400; font-size: 20px; letter-spacing: 0.04em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cKind { font-size: 10px; padding: 3px 6px; border-radius: 4px; background: #000; border: 1px solid currentColor; white-space: nowrap; }
#cClose { min-width: 44px; }
#cRoute { font-size: 13px; color: var(--accent); margin: 6px 0 2px; overflow-wrap: anywhere; }
#cType { font-size: 11px; color: var(--dim); margin-bottom: 8px; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; margin-bottom: 8px; }
.stats div { background: #0b0d18; border: 1px solid var(--line); border-radius: 4px; padding: 6px; }
.stats i { display: block; font-style: normal; font-size: 9px; color: var(--dim); margin-bottom: 3px; }
.stats span { font-size: 13px; }
.row2 { display: flex; gap: 6px; }
.row2 button { flex: 1; }
/* held sideways: the card becomes a side panel so the view stays visible */
@media (orientation: landscape) and (max-height: 600px) {
  #card { left: auto; right: max(8px, env(safe-area-inset-right, 0px)); transform: none; top: 64px; bottom: auto; width: min(300px, 42%); max-height: calc(100% - 72px); overflow: auto; padding: 8px 10px; }
  #cCall { font-size: 16px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .row2 { flex-direction: column; }
  #zoom { right: auto; left: max(8px, env(safe-area-inset-left, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
}

/* sheets: flight list */
.sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, 0.72); display: grid; place-items: center; padding: 16px; }
.card { width: min(460px, 100%); max-height: 100%; overflow: auto; background: #151830; border: 2px solid var(--line); border-radius: 8px; padding: 16px; }
.card h2 { margin: 0 0 6px; font-size: 18px; color: var(--accent); font-weight: 400; }
.card p { margin: 0 0 12px; color: var(--dim); font-size: 12px; line-height: 1.5; }
.list { display: grid; gap: 6px; margin-bottom: 12px; }
.list button { text-align: left; width: 100%; font-size: 13px; }
.entry { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 12px; }
.entry b { font-weight: 400; color: var(--fg); }
.entry span { color: var(--dim); text-align: right; }
.tally { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tally i { font-style: normal; font-size: 11px; padding: 4px 6px; border-radius: 4px; background: #0b0d18; border: 1px solid var(--line); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: var(--ink); color: var(--accent); font-size: 14px; letter-spacing: 0.1em; text-align: center; padding: 16px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="loading">LOADING MAP...</div>

<div id="top">
  <button id="bView" aria-label="Switch view">MAP</button>
  <button id="bStyle" aria-label="Switch map style">SAT</button>
  <button id="bList" aria-label="List of flights">LIST</button>
  <button id="bAuto" aria-label="Follow nearby flights automatically">AUTO</button>
  <button id="bHome" aria-label="Back to your spot">HOME</button>
  <button id="bExit" aria-label="Back to the flight board">BOARD</button>
</div>
<div id="credit"></div>
<div id="zoom"><button id="bIn" aria-label="Zoom in">+</button><button id="bOut" aria-label="Zoom out">-</button></div>

<div id="card" hidden aria-live="polite">
  <div class="ch"><span id="cKind"></span><b id="cCall"></b><button id="cClose" aria-label="Close flight card">X</button></div>
  <div id="cRoute"></div>
  <div id="cType"></div>
  <div class="stats">
    <div><i>ALTITUDE</i><span id="sAlt"></span></div><div><i>SPEED</i><span id="sSpd"></span></div>
    <div><i>CLIMB</i><span id="sVs"></span></div><div><i>HEADING</i><span id="sHdg"></span></div><div><i>FROM YOU</i><span id="sDist"></span></div>
  </div>
  <div class="row2"><button id="cFollow">FOLLOW IN 3D</button><button id="cMap">MAP</button></div>
</div>

<div id="listSheet" class="sheet" hidden>
  <div class="card" role="dialog" aria-labelledby="listTitle">
    <h2 id="listTitle">Flights near you</h2>
    <p id="listNote"></p>
    <div class="list" id="flights"></div>
    <div class="list"><button id="bListClose">Close</button></div>
  </div>
</div>

<script>
(function () {
"use strict";

/* ================= setup ================= */
var cfg = { name: "HURRICANE UT", lat: 37.1753, lon: -113.2899 };
try { var saved = JSON.parse(localStorage.getItem("standby.cfg") || "null"); if (saved) { cfg.name = saved.name || cfg.name; cfg.lat = +saved.lat || cfg.lat; cfg.lon = +saved.lon || cfg.lon; } } catch (e) {}

var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var buf = document.createElement("canvas"), b = buf.getContext("2d");
var BW = 0, BH = 0, SCALE = 1;
function resize() {
  var w = innerWidth, h = innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
  SCALE = Math.min(w, h) / 224;               // the short side of the screen is 224 game pixels, like a Super NES
  BW = Math.ceil(w / SCALE); BH = Math.ceil(h / SCALE);
  buf.width = BW; buf.height = BH;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  img = b.createImageData(BW, BH); px32 = new Uint32Array(img.data.buffer);
}
var img = null, px32 = null;

var clamp = function (v, a, c) { return v < a ? a : v > c ? c : v; };
var DEG = Math.PI / 180;
function hash2(x, y) { var h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {
  var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  var a = hash2(xi, yi), c = hash2(xi + 1, yi), d = hash2(xi, yi + 1), e = hash2(xi + 1, yi + 1);
  return (a + (c - a) * u) + ((d + (e - d) * u) - (a + (c - a) * u)) * v;
}
function fbm(x, y) { return vnoise(x, y) * 0.55 + vnoise(x * 2.1 + 7, y * 2.1 + 3) * 0.3 + vnoise(x * 4.3 + 1, y * 4.3 + 9) * 0.15; }
function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

/* ================= world map raster =================
   The lower 48 plus a margin, at 0.04 degrees per cell. Land and US state shapes come from the free
   world-atlas and us-atlas files; each cell gets a terrain type by region, which sets its colors. */
var G = { lon0: -130, lat0: 52, step: 0.04, w: 1700, h: 750 };
var CELL = null;     // terrain type per cell
var SID = null;      // which US state a cell is in (0 = not the US), for drawing thin borders
var T = { OCEAN: 0, LAKE: 1, RED: 2, TAN: 3, MTN: 4, FOREST: 5, PNW: 6, PLAINS: 7, FARM: 8, SWAMP: 9, FOREIGN: 10, HILLS: 11, CHAP: 12, BEACH: 13, SNOW: 14, CITY: 15 };
var PAL = [];
PAL[T.OCEAN]   = ["#1d4f91", "#215a9e", "#2464a8", "#6fb4e8"];
PAL[T.LAKE]    = ["#2a6fb4", "#2f7bc0", "#3586c8", "#8fcaf0"];
PAL[T.RED]     = ["#c8532c", "#b44726", "#d4683a", "#e8a070"];
PAL[T.TAN]     = ["#d9b27c", "#c99d68", "#e6c493", "#b8875a"];
PAL[T.MTN]     = ["#7a7262", "#8d8470", "#665f52", "#a89e88"];
PAL[T.FOREST]  = ["#2f6b3a", "#3a7d44", "#255a30", "#4c8f50"];
PAL[T.PNW]     = ["#1f4d2f", "#2a5e38", "#183f26", "#3a6e44"];
PAL[T.PLAINS]  = ["#b9b46a", "#a8a35c", "#c9c47a", "#9a9450"];
PAL[T.FARM]    = ["#6f9a3e", "#88b04b", "#b8a95a", "#5d8a35"];
PAL[T.SWAMP]   = ["#4f7a4a", "#5f8a55", "#3f6a42", "#2f7bc0"];
PAL[T.FOREIGN] = ["#7f8a6c", "#8a9476", "#737e62", "#959e80"];
PAL[T.HILLS]   = ["#3d6e3c", "#4a7c45", "#335e33", "#5a8a50"];
PAL[T.CHAP]    = ["#a89a62", "#97895a", "#b8aa72", "#7f8a50"];
PAL[T.BEACH]   = ["#e8d8a8", "#d8c898", "#f0e4bc", "#c8b888"];
PAL[T.SNOW]    = ["#eef2f8", "#d7dde8", "#ffffff", "#b8c2d4"];
PAL[T.CITY]    = ["#8a8a94", "#a0a0aa", "#6e6e78", "#ffe08a"];
var PALRGB = PAL.map(function (p) { return p.map(hexRgb); });

function segDist(la, lo, a, c) { // degrees, rough, for drawing mountain bands
  var ax = a[1], ay = a[0], bx = c[1], by = c[0];
  var dx = bx - ax, dy = by - ay, t = clamp(((lo - ax) * dx + (la - ay) * dy) / (dx * dx + dy * dy), 0, 1);
  return Math.hypot(lo - (ax + t * dx), la - (ay + t * dy));
}
function inEllipse(la, lo, cla, clo, rla, rlo) { var y = (la - cla) / rla, x = (lo - clo) / rlo; return x * x + y * y < 1; }
var LAKES = [ // rough ovals: the US map files cut the Great Lakes out of the states, so they are filled in here
  [41.1, -112.55, 0.42, 0.32], [47.7, -88.0, 0.75, 3.4], [47.2, -90.6, 0.35, 1.4], [44.0, -87.0, 1.9, 0.55],
  [45.6, -86.0, 0.35, 1.0], [44.8, -82.4, 1.0, 0.9], [45.6, -81.0, 0.3, 1.2], [42.2, -81.2, 0.45, 2.1],
  [43.65, -77.8, 0.3, 1.5], [26.95, -80.8, 0.22, 0.2], [39.1, -120.03, 0.1, 0.06], [36.15, -114.4, 0.08, 0.3], [37.2, -110.9, 0.15, 0.4]
];
function terrainUS(la, lo) {
  var n = fbm(lo * 0.7, la * 0.7), e = (n - 0.5) * 2.2;
  if (la > 35.6 && la < 49 && lo > -111.6 + e * 0.6 && lo < -104.8 + e * 0.5 && !(la > 41 && la < 43.6 && lo > -109.6 && lo < -106.4)) return n > 0.62 && la > 37 ? T.SNOW : T.MTN;
  if (segDist(la, lo, [40.3, -121.4], [35.8, -118.3]) < 0.5 + e * 0.15) return n > 0.6 ? T.SNOW : T.MTN;
  if (lo > -122.5 && lo < -121.2 && la > 40.6 && la < 49) return n > 0.66 ? T.SNOW : T.MTN;
  if (lo > -112.2 && lo < -109.4 && la > 39.4 && la < 41.9 && (lo > -111.9 + e * 0.2) && !(lo < -111 && la > 40.9)) return T.MTN;
  if (segDist(la, lo, [34.3, -85.3], [42.3, -74.6]) < 0.9 + e * 0.2 || segDist(la, lo, [42.3, -74.6], [45.4, -70.6]) < 0.8) return T.HILLS;
  if (la > 35.3 && la < 38.7 + e * 0.3 && lo > -114.3 && lo < -108.4 + e * 0.4) return T.RED;
  if (lo < -121 && la > 42) return T.PNW;
  if (lo > -117.2 && lo < -111.4 && la > 44.2 && la < 49) return n > 0.55 ? T.MTN : T.FOREST;
  if (lo < -119.4 && la < 40.3) { if (lo > -122.1 && la > 35.2 && la < 40.2 && lo < -119.6) return T.FARM; return T.CHAP; }
  if (lo < -109 && la < 43) return T.TAN;
  if (lo < -103 && la < 36.2) return T.TAN;
  if (lo < -100.5 && la < 32.8) return T.TAN;
  if (lo < -97.6) return T.PLAINS;
  if (la < 28.6 && lo > -82.8) return T.SWAMP;
  if (la < 30.6 && lo > -94.5 && lo < -88) return T.SWAMP;
  if (la > 36.4 && la < 46.2 && lo < -81.6) return T.FARM;
  return T.FOREST;
}

function buildWorld(land, states) {
  var c = document.createElement("canvas"); c.width = G.w; c.height = G.h;
  var x = c.getContext("2d");
  var px = function (lo) { return (lo - G.lon0) / G.step; }, py = function (la) { return (G.lat0 - la) / G.step; };
  function trace(geo) {
    var polys = geo.type === "Polygon" ? [geo.coordinates] : geo.type === "MultiPolygon" ? geo.coordinates : [];
    polys.forEach(function (poly) { poly.forEach(function (ring) {
      ring.forEach(function (p, i) { var X = px(p[0]), Y = py(p[1]); if (i) x.lineTo(X, Y); else x.moveTo(X, Y); });
      x.closePath();
    }); });
  }
  function fill(fc, color) { x.fillStyle = color; fc.features.forEach(function (f) { x.beginPath(); trace(f.geometry); x.fill("evenodd"); }); }
  x.fillStyle = "#000"; x.fillRect(0, 0, G.w, G.h);
  fill(land, "#ff0000");                       // any land
  fill(states, "#00ff00");                     // US states
  var a = x.getImageData(0, 0, G.w, G.h).data;
  x.fillStyle = "#000"; x.fillRect(0, 0, G.w, G.h);
  states.features.forEach(function (f, n) { x.fillStyle = "rgb(" + (n + 1) + ",0,0)"; x.beginPath(); trace(f.geometry); x.fill("evenodd"); });
  var s = x.getImageData(0, 0, G.w, G.h).data;
  CELL = new Uint8Array(G.w * G.h); SID = new Uint8Array(G.w * G.h);
  for (var j = 0; j < G.h; j++) {
    var la = G.lat0 - (j + 0.5) * G.step;
    for (var i = 0; i < G.w; i++) {
      var k = j * G.w + i, lo = G.lon0 + (i + 0.5) * G.step;
      var us = a[k * 4 + 1] > 127, anyLand = a[k * 4] > 127 || us;
      // warp where each cell looks up its region so region edges wander like real landforms
      var t = !anyLand ? T.OCEAN : !us ? T.FOREIGN : terrainUS(la + (fbm(lo * 0.45 + 11, la * 0.45) - 0.5) * 2.2, lo + (fbm(lo * 0.45, la * 0.45 + 23) - 0.5) * 2.8);
      for (var q = 0; q < LAKES.length; q++) { var L = LAKES[q]; if (anyLand && inEllipse(la, lo, L[0], L[1], L[2], L[3])) { t = T.LAKE; break; } }
      CELL[k] = t;
      if (us) SID[k] = s[k * 4];
    }
  }
  // beaches and coastlines: land cells that touch the ocean
  for (var jj = 1; jj < G.h - 1; jj++) for (var ii = 1; ii < G.w - 1; ii++) {
    var kk = jj * G.w + ii, tt = CELL[kk];
    if (tt === T.OCEAN || tt === T.LAKE) continue;
    if (CELL[kk - 1] === T.OCEAN || CELL[kk + 1] === T.OCEAN || CELL[kk - G.w] === T.OCEAN || CELL[kk + G.w] === T.OCEAN) CELL[kk] = T.BEACH;
  }
  // cities around big airports
  AIRPORTS.forEach(function (ap) {
    var ci = Math.round((ap[3] - G.lon0) / G.step), cj = Math.round((G.lat0 - ap[2]) / G.step), r = ap[5] || 3;
    for (var y = -r; y <= r; y++) for (var xx = -r; xx <= r; xx++) {
      if (xx * xx + y * y > r * r || hash2(ci + xx, cj + y) < 0.25) continue;
      var k2 = (cj + y) * G.w + ci + xx;
      if (k2 >= 0 && k2 < CELL.length && CELL[k2] !== T.OCEAN && CELL[k2] !== T.LAKE) CELL[k2] = T.CITY;
    }
  });
}
function cellAt(la, lo) {
  var i = Math.floor((lo - G.lon0) / G.step), j = Math.floor((G.lat0 - la) / G.step);
  if (i < 0 || j < 0 || i >= G.w || j >= G.h || !CELL) return T.OCEAN;
  return CELL[j * G.w + i];
}

/* code, name, lat, lon, place, city radius in cells */
var AIRPORTS = [
  ["SGU", "ST GEORGE", 37.036, -113.510, "ST GEORGE UT", 2], ["SLC", "SALT LAKE CITY", 40.788, -111.978, "SALT LAKE CITY UT", 5],
  ["LAS", "LAS VEGAS", 36.084, -115.154, "LAS VEGAS NV", 5], ["GCN", "GRAND CANYON", 35.952, -112.147, "GRAND CANYON AZ", 0],
  ["PHX", "PHOENIX", 33.434, -112.012, "PHOENIX AZ", 6], ["LAX", "LOS ANGELES", 33.942, -118.408, "LOS ANGELES CA", 8],
  ["SAN", "SAN DIEGO", 32.733, -117.190, "SAN DIEGO CA", 4], ["SFO", "SAN FRANCISCO", 37.619, -122.375, "SAN FRANCISCO CA", 5],
  ["SEA", "SEATTLE", 47.450, -122.309, "SEATTLE WA", 5], ["PDX", "PORTLAND", 45.589, -122.597, "PORTLAND OR", 4],
  ["BOI", "BOISE", 43.564, -116.223, "BOISE ID", 3], ["DEN", "DENVER", 39.856, -104.674, "DENVER CO", 6],
  ["ABQ", "ALBUQUERQUE", 35.040, -106.609, "ALBUQUERQUE NM", 3], ["DFW", "DALLAS FT WORTH", 32.897, -97.038, "DALLAS TX", 7],
  ["IAH", "HOUSTON", 29.984, -95.341, "HOUSTON TX", 7], ["MCI", "KANSAS CITY", 39.298, -94.714, "KANSAS CITY MO", 4],
  ["MSP", "MINNEAPOLIS", 44.882, -93.222, "MINNEAPOLIS MN", 5], ["STL", "ST LOUIS", 38.749, -90.370, "ST LOUIS MO", 4],
  ["MSY", "NEW ORLEANS", 29.993, -90.258, "NEW ORLEANS LA", 3], ["ORD", "CHICAGO", 41.979, -87.904, "CHICAGO IL", 8],
  ["BNA", "NASHVILLE", 36.124, -86.678, "NASHVILLE TN", 4], ["DTW", "DETROIT", 42.212, -83.353, "DETROIT MI", 5],
  ["ATL", "ATLANTA", 33.640, -84.427, "ATLANTA GA", 6], ["CLT", "CHARLOTTE", 35.214, -80.943, "CHARLOTTE NC", 4],
  ["MCO", "ORLANDO", 28.429, -81.309, "ORLANDO FL", 4], ["MIA", "MIAMI", 25.796, -80.287, "MIAMI FL", 5],
  ["DCA", "WASHINGTON", 38.852, -77.038, "WASHINGTON DC", 6], ["JFK", "NEW YORK", 40.640, -73.779, "NEW YORK NY", 9],
  ["BOS", "BOSTON", 42.366, -71.010, "BOSTON MA", 5]
];

/* ================= map tiles =================
   Satellite photos (USGS National Map, public domain), streets (OpenStreetMap, credit required, map
   view only) and ground height (AWS Terrain Tiles from Mapzen). Each tile is stored small: colors cut
   to 15-bit like a Super NES, heights as whole meters. Missing detail falls back to a coarser tile. */

  $("cFollow").textContent = view === "3d" ? "SIDE VIEW" : "FOLLOW IN 3D";
  var cardAtBottom = !(innerWidth > innerHeight && innerHeight <= 600);
  document.documentElement.style.setProperty("--cardh", cardAtBottom ? ($("card").offsetHeight + 8) + "px" : "0px");
}
function shortName(n) { return (n || "").toUpperCase().replace(/ INTERNATIONAL AIRPORT$| AIRPORT$/, ""); }

/* ================= flight list ================= */
function openList() {
  var arr = []; traffic.forEach(function (p) { var w = where(p, Date.now()), h = nmHome(w.lat, w.lon); arr.push({ p: p, w: w, h: h }); });
  arr.sort(function (a, c) { return a.h.d - c.h.d; });
  $("listTitle").textContent = "Flights near " + HOME.name.toLowerCase().replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  $("listNote").textContent = demoMode ? "No flight source is answering right now, so these are demo planes." : arr.length + " flights within about 100 nautical miles. Tap one to follow it.";
  var box2 = $("flights"); box2.innerHTML = "";
  arr.slice(0, 60).forEach(function (o) {
    var bt = document.createElement("button");
    bt.innerHTML = '<span style="color:' + KIND_COL[o.p.kind] + '"></span>';
    bt.firstChild.textContent = o.p.call.padEnd(8);
    bt.appendChild(document.createTextNode(" " + (o.p.type || "----") + "  " + (o.p.ground ? "GND" : fmtAlt(o.w.alt)) + "  " + (o.h.d < 10 ? o.h.d.toFixed(1) : Math.round(o.h.d)) + "NM " + dirName2(o.h.brg)));
    bt.addEventListener("click", function () { $("listSheet").hidden = true; select(o.p.hex, "3d"); });
    box2.appendChild(bt);
  });
  $("listSheet").hidden = false;
}

/* ================= auto mode: follow the nearest flights in turn, for a tablet on the wall ================= */
function stepAuto() {
  if (!auto || Date.now() - autoAt < 40000) return;
  autoAt = Date.now();
  var arr = []; traffic.forEach(function (p) { if (p.ground) return; var w = where(p, Date.now()); arr.push([nmHome(w.lat, w.lon).d, p.hex]); });
  arr.sort(function (a, c) { return a[0] - c[0]; });
  var pool = arr.slice(0, 6).filter(function (a) { return a[1] !== sel; });
  if (!pool.length) return;
  select(pool[Math.floor(Math.random() * pool.length)][1], view === "map" ? "3d" : view);
}

/* ================= loop ================= */
var lastT = performance.now(), cardAt = 0, demoAt = 0;
function frame(now) {
  var dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; frameNo++;
  updateFocus(now, dt);
  if (CELL) { if (view === "map") drawMap(Date.now()); else if (view === "side") drawSide(Date.now()); else draw3D(Date.now()); }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, BW * SCALE * (cv.width / innerWidth), BH * SCALE * (cv.height / innerHeight));
  if ((frameNo & 63) === 0) evictTiles();
  maybeFetch(HOME.lat, HOME.lon); maybeFetch(P.lat, P.lon);
  if (now - demoAt > 1000) { demoAt = now; stepDemo(); prune(); stepAuto(); }
  if (sel && now - cardAt > 500) { cardAt = now; fillCard(false); }
  requestAnimationFrame(frame);
}

/* ================= controls ================= */
var VIEWS = ["map", "3d", "side"], STYLES = ["sat", "osm", "pixel"], STYLE_NAME = { sat: "SAT", osm: "STREET", pixel: "PIXEL" };
function savePrefs() { try { localStorage.setItem("standby.liveview", JSON.stringify({ view: view, style: style, zm: ZM })); } catch (e) {} }
function syncButtons() {
  $("bView").textContent = view === "3d" ? "3D" : view === "map" ? "MAP" : "SIDE";
  $("bStyle").textContent = STYLE_NAME[style];
  $("bAuto").classList.toggle("on", auto);
  $("zoom").hidden = view !== "map";
  // street tiles are for the map view only, to stay within OpenStreetMap's tile policy
  var shown = style === "osm" && view !== "map" ? "sat" : style;
  $("credit").innerHTML = shown === "osm" ? 'Map &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors. Flights adsb.lol and friends.'
    : shown === "sat" ? "Imagery USGS National Map. Elevation Mapzen Terrain Tiles. Flights adsb.lol and friends."
    : "Elevation Mapzen Terrain Tiles. Flights adsb.lol and friends.";
  if (sel) fillCard(false);
}
function cycleView() { view = VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length]; orbit = 0; syncButtons(); savePrefs(); }
function cycleStyle() { style = STYLES[(STYLES.indexOf(style) + 1) % STYLES.length]; syncButtons(); savePrefs(); prefetch(); }
function zoomBy(f) { ZM = clamp(ZM * f, 0.08, 14); savePrefs(); }
$("bView").addEventListener("click", cycleView);
$("bStyle").addEventListener("click", cycleStyle);
$("bList").addEventListener("click", openList);
$("bListClose").addEventListener("click", function () { $("listSheet").hidden = true; });
$("bAuto").addEventListener("click", function () { auto = !auto; autoAt = 0; syncButtons(); });
$("bHome").addEventListener("click", function () { deselect(); P.lat = HOME.lat; P.lon = HOME.lon; if (view !== "map") { view = "map"; syncButtons(); } });
$("bExit").addEventListener("click", function () { location.href = "./"; });
$("bIn").addEventListener("click", function () { zoomBy(1.6); });
$("bOut").addEventListener("click", function () { zoomBy(1 / 1.6); });
$("cClose").addEventListener("click", deselect);
$("cFollow").addEventListener("click", function () { view = view === "3d" ? "side" : "3d"; orbit = 0; syncButtons(); savePrefs(); });
$("cMap").addEventListener("click", function () { view = "map"; follow = true; syncButtons(); savePrefs(); });

// drag to pan the map (or turn the camera in 3D and side view), pinch or wheel to zoom, tap a plane to pick it
var ptrs = {}, dragFrom = null, moved = 0, pinch0 = 0, zoom0 = 1;
cv.addEventListener("pointerdown", function (e) {
  cv.setPointerCapture(e.pointerId); ptrs[e.pointerId] = [e.clientX, e.clientY];
  var ids = Object.keys(ptrs);
  if (ids.length === 2) { var a = ptrs[ids[0]], c = ptrs[ids[1]]; pinch0 = Math.hypot(a[0] - c[0], a[1] - c[1]); zoom0 = ZM; }
  dragFrom = [e.clientX, e.clientY]; moved = 0;
});
cv.addEventListener("pointermove", function (e) {
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = [e.clientX, e.clientY];
  var ids = Object.keys(ptrs);
  if (ids.length === 2 && pinch0) { var a = ptrs[ids[0]], c = ptrs[ids[1]]; ZM = clamp(zoom0 * Math.hypot(a[0] - c[0], a[1] - c[1]) / pinch0, 0.08, 14); moved = 99; return; }
  var dx = e.clientX - dragFrom[0], dy = e.clientY - dragFrom[1]; dragFrom = [e.clientX, e.clientY]; moved += Math.abs(dx) + Math.abs(dy);
  if (moved < 6) return;
  if (view === "map") {
    follow = false;
    P.lon -= dx / SCALE / ZM / (60 * Math.cos(P.lat * DEG)); P.lat += dy / SCALE / ZM / 60;
    P.lat = clamp(P.lat, 15, 60); P.lon = clamp(P.lon, -170, -50);
  } else orbit = (orbit - dx * 0.35 + 360) % 360;
});
function endPtr(e) {
  if (!ptrs[e.pointerId]) return;
  delete ptrs[e.pointerId];
  if (Object.keys(ptrs).length) return;
  if (moved < 6) { // a tap: pick the closest plane drawn near that spot
    var x = e.clientX / SCALE, y = e.clientY / SCALE, best = null, bd = 16;
    TAPS.forEach(function (t) { var d = Math.hypot(t[0] - x, t[1] - y); if (d < bd) { bd = d; best = t[2]; } });
    if (best) select(best); else if (view === "map" && sel) deselect();
  } else savePrefs();
  pinch0 = 0;
}
cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("wheel", function (e) { e.preventDefault(); zoomBy(e.deltaY > 0 ? 1 / 1.2 : 1.2); }, { passive: false });
addEventListener("keydown", function (e) {
  if (e.key === "v") cycleView(); if (e.key === "m") cycleStyle(); if (e.key === "+" || e.key === "=") zoomBy(1.4); if (e.key === "-") zoomBy(1 / 1.4);
  if (e.key === "Escape") { deselect(); $("listSheet").hidden = true; } if (e.key === "l") openList(); if (e.key === "a") $("bAuto").click();
});

/* ================= boot ================= */
resize(); addEventListener("resize", resize);
syncButtons();
var fontsReady = document.fonts && document.fonts.load ? document.fonts.load("8px Silkscreen").catch(function () {}) : Promise.resolve();
Promise.all([
  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-50m.json").then(function (r) { return r.json(); }),
  fetch("https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json").then(function (r) { return r.json(); }),
  fontsReady
]).then(function (res) {
  buildWorld(topojson.feature(res[0], res[0].objects.land), topojson.feature(res[1], res[1].objects.states));
  $("loading").hidden = true;
}).catch(function () {
  $("loading").textContent = "THE MAP DID NOT LOAD. CHECK THE CONNECTION AND RELOAD.";
});
prefetch();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
